services:
  # Наша база данных PostgreSQL
  db:
    image: postgres:17-alpine
    container_name: social_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Сохраняем данные локально, чтобы они не удалились при перезапуске контейнера
      - postgres_data:/var/lib/postgresql/data
    networks:
      - social_network

  # Интерфейс для просмотра базы данных в браузере
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: social_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - social_network

volumes:
  postgres_data:

networks:
  social_network:
    driver: bridge