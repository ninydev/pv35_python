{% extends 'layout/main.html' %}

{% block content %}


<div class="row">
    {% for news in news_list %}
        <div class="col-md-4">
            <h2>{{ news.title }}</h2>
            <p>{{ news.content }}</p>
        <a href="{% url 'news_detail' news.id %}">More</a>
        </div>
    {% endfor %}
</div>

{% endblock %}
